<!doctype html>
<html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ tr('Notifications') }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><h1 class="h3">{{ tr('Notifications') }}</h1>{% include '_language_switch.html' %}</div><a href="{{ url_for('dashboard') }}">{{ tr('Dashboard') }}</a><div class="mt-3">{% for item in notifications %}<article class="card mb-2"><div class="card-body d-flex justify-content-between gap-3"><div><p class="mb-1">{{ item.notification_text }}</p><small class="text-muted">{{ item.created_at }}</small>{% if item.read_at %}<span class="badge text-bg-secondary ms-2">Read</span>{% endif %}</div>{% if not item.read_at %}<form method="post" action="{{ url_for('mark_notification_read', notification_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-primary">Mark read</button></form>{% endif %}</div></article>{% else %}<p class="text-muted">No reminders yet.</p>{% endfor %}</div></main></body></html>
