<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patient Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/register.css') }}">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container-fluid register-page">

<div class="row">

<!-- Left Side -->

<div class="col-lg-5 left-panel">

<img src="{{ url_for('static', filename='images/doctor.png') }}"
class="doctor-image">

<h2>

AI Smart Hospital

</h2>

<p>

Machine Learning Based Healthcare

</p>

</div>

<!-- Right Side -->

<div class="col-lg-7">

<div class="register-card">

<h2>

Patient Registration

</h2>

<p>

Create your account to access AI healthcare services.

</p>

<form method="POST" action="{{url_for('register')}}">
    {% if error %}
    <div class="alert alert-danger">
        {{error}}
    </div>
    {% endif %}
<!-- Full Name -->

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="full_name"
value="{{ form.get('full_name', '') }}"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<!-- Email -->

<div class="col-md-6 mb-3">

<label class="form-label">Email Address</label>

<input
type="email"
name="email"
value="{{ form.get('email', '') }}"
class="form-control"
placeholder="Enter your email"
required>

</div>

<!-- Phone -->

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input
type="text"
name="phone"
value="{{ form.get('phone', '') }}"
class="form-control"
placeholder="Enter phone number"
required>

</div>

<!-- Age -->

<div class="col-md-6 mb-3">

<label class="form-label">Age</label>

<input
type="number"
name="age"
value="{{ form.get('age', '') }}"
class="form-control"
placeholder="Enter age"
required>

</div>

<!-- Gender -->

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select name="gender" class="form-select">

<option selected disabled>Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<!-- Blood Group -->

<div class="col-md-6 mb-3">

<label class="form-label">Blood Group</label>

<select name="blood_group" class="form-select">

<option selected disabled>Select Blood Group</option>

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>AB+</option>

<option>AB-</option>

<option>O+</option>

<option>O-</option>

</select>

</div>

<!-- Address -->

<div class="col-12 mb-3">

<label class="form-label">Address</label>

<textarea
name="address"
class="form-control"
rows="3"
placeholder="Enter your address"></textarea>

</div>

<!-- Password -->

<div class="col-md-6 mb-3">

<label class="form-label">Password</label>

<div class="input-group">

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Create Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('password')">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<!-- Confirm Password -->

<div class="col-md-6 mb-3">

<label class="form-label">Confirm Password</label>

<div class="input-group">

<input
type="password"
name="confirm_password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password">

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('confirmPassword')">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<!-- Terms -->

<div class="col-12 mb-3 form-check">

<input
class="form-check-input"
type="checkbox"
name="terms"
id="terms">

<label
class="form-check-label"
for="terms">

I agree to the Terms & Conditions

</label>

</div>

<!-- Button -->

<div class="col-12">

<button
type="submit"
class="btn btn-success w-100">

Create Account

</button>

</div>

<div class="text-center mt-4">

Already have an account?

<a href="{{ url_for('login') }}">

Login Here

</a>

</div>

</div>
</form>

</div>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
