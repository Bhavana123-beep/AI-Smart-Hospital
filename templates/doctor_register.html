<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Registration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:760px"><div class="card shadow-sm p-4"><h2>Doctor Registration</h2><p class="text-muted">Create your doctor account to access assigned appointments.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('doctor_register') }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="name" value="{{ form.get('full_name','') }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ form.get('email','') }}" required></div><div class="col-md-6"><label class="form-label">Phone Number</label><input class="form-control" name="phone" value="{{ form.get('phone','') }}" required></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department" required><option value="" disabled {% if not form.get('department') %}selected{% endif %}>Select department</option>{% for item in ['Cardiology','Neurology','Dermatology','Orthopedics','Pulmonology','Gastroenterology','Urology','Endocrinology','General Medicine','Infectious Disease','Pediatrics'] %}<option value="{{ item }}" {% if form.get('department') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ form.get('specialization','') }}" required></div><div class="col-md-6"><label class="form-label">Qualification</label><input class="form-control" name="qualification" value="{{ form.get('qualification','') }}" required></div><div class="col-md-6"><label class="form-label">Years of Experience</label><input class="form-control" type="number" min="0" name="experience" value="{{ form.get('experience','') }}" required></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Confirm Password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div></div><button class="btn btn-primary mt-4">Register</button><a class="btn btn-link mt-4" href="{{ url_for('doctor_login') }}">Already registered? Doctor Login</a></form></div></main></body></html>
