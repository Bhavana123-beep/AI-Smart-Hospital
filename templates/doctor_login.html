<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card shadow-sm p-4"><h2>Doctor Portal</h2><p class="text-muted">Sign in to manage your assigned appointments.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('doctor_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Email</label><input class="form-control mb-3" type="text" inputmode="email" autocomplete="username" name="email" placeholder="doctor@example.com" required autofocus><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form><a class="btn btn-outline-primary w-100 mt-2" href="{{ url_for('doctor_register') }}">Doctor Registration</a><a class="btn btn-link w-100 mt-2" href="{{ url_for('login') }}">Back to Patient Login</a></div></main><script src="{{ url_for('static', filename='js/email_validation.js') }}" defer></script></body></html>
