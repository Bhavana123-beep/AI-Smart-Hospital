<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><a href="{{ url_for('doctor_dashboard') }}" class="btn btn-outline-primary float-end">Dashboard</a><h2>Doctor Profile</h2><div class="card p-4"><p><b>Name:</b> {{ doctor.full_name }}</p><p><b>Email:</b> {{ doctor.email }}</p><p><b>Department:</b> {{ doctor.department }}</p><p><b>Specialization:</b> {{ doctor.specialization }}</p><p><b>Experience:</b> {{ doctor.experience }} years</p><p><b>Qualification:</b> {{ doctor.qualification }}</p><p><b>Availability:</b> {{ doctor.availability }}</p></div></main></body></html>
