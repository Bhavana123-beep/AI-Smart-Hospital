<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Reschedule</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:650px"><div class="card p-4"><h2>Request Reschedule</h2><p>{{ appointment.doctor_name }} — current: {{ appointment.appointment_date }} {{ appointment.appointment_time }}</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input class="form-control mb-3" type="date" name="appointment_date" required><input class="form-control mb-3" type="time" name="appointment_time" required><textarea class="form-control mb-3" name="reason" placeholder="Reason"></textarea><button class="btn btn-warning">Send Request</button></form></div></main></body></html>
