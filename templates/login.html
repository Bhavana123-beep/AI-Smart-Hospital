<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-container">

<div class="login-card">

<h2>Patient Login</h2>

<p>Welcome back to AI Smart Hospital</p>

<form method="POST" action="{{url_for('login')}}">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<div class="mb-3">

<label>Patient ID</label>

<input
type="text"
name="patient_id"
class="form-control"
placeholder="PAT-100001"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<div class="d-grid">

<button
class="btn btn-primary">

Login

</button>

</div>

<div class="text-center mt-3">

Don't have an account?

<a href="{{ url_for('register') }}">

Register

</a>

</div>

<div class="text-center mt-2">

<a href="{{ url_for('doctor_login') }}">Doctor Login</a>

</div>

<div class="text-center mt-2">

<a href="{{ url_for('doctor_register') }}">Doctor Registration</a>

</div>

</form>

</div>

</div>

</body>

</html>
