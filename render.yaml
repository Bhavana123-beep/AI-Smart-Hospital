services:
  - type: cron
    name: smart-hospital-appointment-reminders
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_reminder_job.py
    envVars:
      - key: REMINDER_WEB_URL
        sync: false
      - key: REMINDER_JOB_TOKEN
        sync: false
